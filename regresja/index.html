<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regresja logistyczna – krzywa S i próg</title><link rel="stylesheet" href="lr.css"><link rel="stylesheet" href="learn.css">
<style>.side{width:350px;gap:14px;justify-content:center}.side h1{font-size:28px}#cv{height:110px}.cm .n{padding:6px 0;font-size:26px}.m b{font-size:28px}.sec{border-top:2px solid #ffffff40;padding-top:12px}</style></head>
<body><a href="../index.html" title="Wszystkie wizualizacje" style="position:fixed;left:6px;top:6px;z-index:9;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font:700 16px Inter,system-ui,sans-serif;color:#2d4fa3;background:#ffffffd9;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px #0003">←</a><div class="app"><div class="stage"><canvas id="c"></canvas></div>
<div class="side"><h1>Krzywa S i próg</h1>
<div><div class="lbl">błąd modelu (loss)</div><canvas id="cv"></canvas></div>
<div class="ctl small"><div class="row1"><span>tempo uczenia</span><b id="lv"></b></div><input id="lr" type="range" min="1" max="40" value="12"></div>
<div class="bar"><button id="go">Start</button><button id="one">Krok</button><button id="rs">Od nowa</button></div>
<div class="sec ctl"><div class="row1"><span>próg</span><b id="tv"></b></div><input id="t" type="range" min="1" max="99" value="50"></div>
<div class="cm"><span></span><span class="h">wykryci</span><span class="h">przeoczeni</span>
<span class="h">chorzy</span><div class="n tp"><small>TP</small><span id="tp"></span></div><div class="n fn"><small>FN</small><span id="fn"></span></div>
<span class="h">zdrowi</span><div class="n fp"><small>FP</small><span id="fp"></span></div><div class="n tn"><small>TN</small><span id="tn"></span></div></div>
<div class="m"><div>recall<b id="rec"></b></div><div>precision<b id="prec"></b></div></div></div></div>
<script src="learn.js"></script><script>
const $=i=>document.getElementById(i),sig=z=>1/(1+Math.exp(-z)),MAX=400,RED='#e4572e',BLUE='#2b6fd6';
function rng(s){let a=s>>>0||1;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const R=rng(21);function randn(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}
/* glukoza na czczo (mg/dl): zdrowi ok. 92, chorzy na cukrzycę ok. 150, z nakładaniem */
const D=[];
for(let i=0;i<160;i++){let v=92+randn()*9;if(R()<.2)v+=Math.abs(randn())*20;D.push({x:v,y:0})}
for(let i=0;i<40;i++){let v=150+randn()*28;if(v<100)v=100+R()*12;D.push({x:v,y:1})}
const MU=D.reduce((s,d)=>s+d.x,0)/D.length,SD=Math.sqrt(D.reduce((s,d)=>s+(d.x-MU)**2,0)/D.length);
const P0={w:-1.2,b:1.4};let p={...P0},hist=[],n=0,timer=null,t=.5,done=false;
const prob=(p,x)=>sig(p.w*(x-MU)/SD+p.b);
function loss(p){let s=0;for(const d of D){const q=Math.min(1-1e-9,Math.max(1e-9,prob(p,d.x)));s-=d.y?Math.log(q):Math.log(1-q)}return s/D.length}
function step(p,lr){let gw=0,gb=0;for(const d of D){const e=prob(p,d.x)-d.y;gw+=e*(d.x-MU)/SD;gb+=e}return{w:p.w-lr*gw/D.length,b:p.b-lr*gb/D.length}}
function metrics(){let tp=0,fp=0,fn=0,tn=0;for(const d of D){const pr=prob(p,d.x)>=t;if(d.y&&pr)tp++;else if(d.y)fn++;else if(pr)fp++;else tn++}return{tp,fp,fn,tn,prec:tp+fp?tp/(tp+fp):1,rec:tp/(tp+fn)}}
const X0=50,X1=250;let geo={};
function spd(){return $('lr').value/400}
/* rozkład kropek bez nakładania: w każdym rzędzie kropki stoją obok siebie */
function swarm(cls,sx,r){const pts=D.filter(d=>d.y===cls).sort((a,b)=>a.x-b.x),last=[];
 return pts.map(d=>{const px=sx(d.x);let k=0;while(last[k]!==undefined&&px-last[k]<2*r+1)k++;last[k]=px;return{d,px,row:k}})}
function draw(){const{c,w,h}=LN.fit($('c')),L=60,Rr=w-24,r=Math.max(4,Math.min(6,w/220)),sx=v=>L+(v-X0)/(X1-X0)*(Rr-L);c.clearRect(0,0,w,h);
 const top=swarm(1,sx,r),bot=swarm(0,sx,r),nT=Math.max(...top.map(q=>q.row))+1,nB=Math.max(...bot.map(q=>q.row))+1,rh=2*r+1;
 const T0=46,B0=h-60,T=T0+nT*rh+14,B=B0-nB*rh-14,sy=v=>B-v*(B-T);geo={T,B};
 const xt=MU+SD*(Math.log(t/(1-t))-p.b)/(p.w||1e-9),pos=p.w>=0,a=Math.max(X0,Math.min(X1,isFinite(xt)?xt:X1));
 // strefa diagnozy
 c.fillStyle='#e4572e1a';if(pos)c.fillRect(sx(a),T0-10,Rr-sx(a),B0-T0+20);else c.fillRect(L,T0-10,sx(a)-L,B0-T0+20);
 c.font='700 18px Inter,sans-serif';c.textAlign='center';
 const zl=pos?[sx(a),Rr]:[L,sx(a)],ol=pos?[L,sx(a)]:[sx(a),Rr];
 if(zl[1]-zl[0]>150){c.fillStyle=RED;c.fillText('diagnoza: cukrzyca',(zl[0]+zl[1])/2,T0-18)}
 if(ol[1]-ol[0]>90){c.fillStyle=BLUE;c.fillText('diagnoza: zdrowy',(ol[0]+ol[1])/2,T0-18)}
 // siatka, osie
 c.strokeStyle='#1f2a4d22';c.lineWidth=1;[0,.5,1].forEach(v=>{c.beginPath();c.moveTo(L,sy(v));c.lineTo(Rr,sy(v));c.stroke()});
 c.fillStyle='#1f2a4d';c.font='600 15px Inter,sans-serif';c.textAlign='right';[0,.5,1].forEach(v=>c.fillText(String(v).replace('.',','),L-10,sy(v)+5));
 c.save();c.translate(18,(T+B)/2);c.rotate(-Math.PI/2);c.textAlign='center';c.font='600 15px Inter,sans-serif';c.fillText('prawdopodobieństwo choroby',0,0);c.restore();
 c.textAlign='center';c.font='600 14px Inter,sans-serif';for(let v=50;v<=250;v+=25)c.fillText(v,sx(v),B0+20);
 c.font='600 17px Inter,sans-serif';c.fillText('glukoza na czczo (mg/dl)',(L+Rr)/2,h-12);
 // kropki: kolor = prawdziwa klasa, czarna obwódka = błąd modelu
 const dot=(q,y,col)=>{const pr=prob(p,q.d.x)>=t,wrong=pr!==!!q.d.y;c.beginPath();c.arc(q.px,y,r,0,6.2832);c.fillStyle=col;c.fill();
  if(wrong){c.lineWidth=2.5;c.strokeStyle='#1f2a4d';c.stroke()}};
 top.forEach(q=>dot(q,T0+r+q.row*rh,RED));bot.forEach(q=>dot(q,B0-r-q.row*rh,BLUE));
 c.font='700 15px Inter,sans-serif';c.textAlign='left';c.fillStyle=RED;c.fillText('chorzy',L+4,T0+r+5);c.fillStyle=BLUE;c.fillText('zdrowi',L+4,B0-r+5);
 // krzywa S
 c.strokeStyle='#1f2a4d';c.lineWidth=4;c.beginPath();for(let i=0;i<=300;i++){const x=X0+(X1-X0)*i/300,X=sx(x),Y=sy(prob(p,x));i?c.lineTo(X,Y):c.moveTo(X,Y)}c.stroke();
 // próg
 c.setLineDash([8,6]);c.strokeStyle=RED;c.lineWidth=2.5;c.beginPath();c.moveTo(L,sy(t));c.lineTo(Rr,sy(t));c.stroke();
 if(isFinite(xt)&&xt>X0&&xt<X1){c.beginPath();c.moveTo(sx(xt),T0-10);c.lineTo(sx(xt),B0+4);c.stroke();c.setLineDash([]);
  c.fillStyle='#ffd89d';c.strokeStyle='#1f2a4d';c.lineWidth=2.5;c.beginPath();c.arc(sx(xt),sy(t),9,0,6.2832);c.fill();c.stroke();
  c.fillStyle='#1f2a4d';c.font='700 15px Inter,sans-serif';c.textAlign=sx(xt)>Rr-80?'right':'left';c.fillText(Math.round(xt)+' mg/dl',sx(xt)+(sx(xt)>Rr-80?-14:14),sy(t)+22)}
 c.setLineDash([]);c.fillStyle=RED;c.textAlign='right';c.font='700 15px Inter,sans-serif';c.fillText('próg',Rr,sy(t)-8)}
function upd(){const m=metrics(),f=v=>Math.round(v*100)+'%';$('lv').textContent=($('lr').value/12).toFixed(1).replace('.',',')+'×';$('tv').textContent=t.toFixed(2).replace('.',',');
 ['tp','fn','fp','tn'].forEach(k=>$(k).textContent=m[k]);$('rec').textContent=f(m.rec);$('prec').textContent=f(m.prec);draw();LN.curve($('cv'),hist,Math.max(60,hist.length))}
function one(){if(done||n>=MAX){stop();return}const q0={...p};let k=0;
 while(k<400){p=step(p,.05);k++;if(Math.hypot(p.w-q0.w,p.b-q0.b)>=spd())break}
 const moved=Math.hypot(p.w-q0.w,p.b-q0.b);n++;hist.push(loss(p));if(moved<spd()*.3){done=true;stop()}upd()}
function stop(){clearInterval(timer);timer=null;$('go').textContent='Start'}
function reset(){stop();done=false;p={...P0};n=0;hist=[loss(p)];upd()}
$('go').onclick=()=>{if(timer)return stop();if(done)reset();$('go').textContent='Stop';timer=setInterval(one,50)};
$('one').onclick=()=>{stop();one()};$('rs').onclick=reset;$('lr').oninput=upd;$('t').oninput=()=>{t=$('t').value/100;upd()};
const cv=$('c');function drag(e){const r=cv.getBoundingClientRect(),v=(geo.B-(e.clientY-r.top))/(geo.B-geo.T);$('t').value=Math.max(1,Math.min(99,Math.round(v*100)));t=$('t').value/100;upd()}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drag(e);cv.onpointermove=drag};cv.onpointerup=()=>cv.onpointermove=null;
addEventListener('resize',upd);hist=[loss(p)];upd();
</script></body></html>
