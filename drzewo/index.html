<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jak uczy się drzewo</title><link rel="stylesheet" href="tv.css">
<style>
.grid{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 215px;grid-template-rows:minmax(0,1fr) 170px;gap:12px}
.card{background:#f5f7fd;border-radius:16px;box-shadow:0 8px 30px #0003;overflow:hidden;min-height:0}
.card canvas{box-shadow:none;border-radius:0;background:transparent}
.corner{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:0;overflow:hidden}
.head{font-size:18px;font-weight:600;line-height:1.3}
.head b{color:#ffd89d}.head small{display:block;font-size:16px;font-weight:500;color:#dfe8ff}
.cnt{font-size:20px;font-weight:700;letter-spacing:.5px}
.cnt i{font-style:normal;padding:0 3px;border-radius:5px;background:#fff}
.corner button{padding:8px 14px;font-size:17px}.corner .bar{flex-direction:row;gap:8px}.corner #rst{flex:0 0 46px;padding:8px 0;font-size:22px}.corner #go{flex:1;padding:8px 6px}
button:disabled{opacity:.45;cursor:default}
</style></head>
<body><a href="../index.html" title="Wszystkie wizualizacje" style="position:fixed;left:6px;top:6px;z-index:9;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font:700 16px Inter,system-ui,sans-serif;color:#2d4fa3;background:#ffffffd9;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px #0003">←</a><div class="app"><div class="grid">
<div class="card" style="background:transparent"><canvas id="c"></canvas></div>
<div class="card"><canvas id="gr"></canvas></div>
<div class="card"><canvas id="gb"></canvas></div>
<div class="corner"><div class="head" id="head"></div><div class="bar"><button id="go" class="on">Szukaj podziału</button><button id="rst" title="Od nowa">↺</button></div></div>
</div></div>
<script src="common.js"></script>
<script>
const S=SKN,$=S.$,C=S.COLORS,ds=S.makeDataset('iris_petal',1),X=ds.X,Y=ds.y;
const NAMES=['długość płatka','szerokość płatka'],MAXD=4,DUR=1800;
const p=new S.Plot($('c'),ds,{margin:0});const _rs=p.resize.bind(p);p.resize=function(){_rs();p.l=0;p.t=0;p.r=p.w;p.b=p.h};p.resize();
let leaves,splits,cur,res,best,hover,mode,scan,raf;
function mk(idx,b,d){const c=[0,0,0];idx.forEach(i=>c[Y[i]]++);const n=idx.length;let g=1;c.forEach(v=>g-=(v/n)**2);return{idx,b,d,c,n,g:Math.max(0,g),pred:S.argmax(c)}}
function init(){cancelAnimationFrame(raf);leaves=[mk(X.map((_,i)=>i),[ds.xlim[0],ds.xlim[1],ds.ylim[0],ds.ylim[1]],0)];splits=[];hover=null;pick()}
function pick(){for(;;){cur=leaves.find(l=>!l.stop&&l.g>1e-9&&l.d<MAXD&&l.n>=2)||null;res=null;best=null;scan=null;hover=null;if(!cur){mode='done';return}compute();if(best){mode='idle';return}cur.stop=true}}
function compute(){res=[0,1].map(f=>{const o=cur.idx.slice().sort((a,b)=>X[a][f]-X[b][f]),n=cur.n,L=[0,0,0],R=cur.c.slice(),pts=[];
 for(let k=0;k<n-1;k++){const i=o[k];L[Y[i]]++;R[Y[i]]--;const v=X[i][f],v2=X[o[k+1]][f];if(v===v2)continue;
  const nl=k+1,nr=n-nl;let gl=1,gr=1;for(let c=0;c<3;c++){gl-=(L[c]/nl)**2;gr-=(R[c]/nr)**2}pts.push([(v+v2)/2,(nl*gl+nr*gr)/n])}pts.unshift([cur.b[2*f],cur.g]);pts.push([cur.b[2*f+1],cur.g]);return pts});
 res.forEach((pts,f)=>pts.forEach(q=>{if(!best||q[1]<best.score-1e-12)best={f,thr:q[0],score:q[1]}}));
 if(best&&best.score>=cur.g-1e-12)best=null}
function apply(){const{f,thr}=best,L=[],R=[];cur.idx.forEach(i=>(X[i][f]<=thr?L:R).push(i));
 const b=cur.b,bl=b.slice(),br=b.slice();bl[2*f+1]=thr;br[2*f]=thr;splits.push({f,thr,b:b.slice()});
 leaves.splice(leaves.indexOf(cur),1,mk(L,bl,cur.d+1),mk(R,br,cur.d+1));pick()}
function counts(f,t){const l=[0,0,0],r=[0,0,0];cur.idx.forEach(i=>(X[i][f]<=t?l:r)[Y[i]]++);return{l,r}}
/* ---- animacja skanu ---- */
function startScan(){mode='scan';scan={f:0,t0:performance.now(),pos:cur.b[0]};loop()}
function loop(){const now=performance.now();let k=(now-scan.t0)/DUR;const f=scan.f,b=cur.b;
 if(k>=1){if(f===0){scan={f:1,t0:now,pos:b[2]};k=0}else{mode='found';scan=null;draw();return}}
 const ff=scan.f;scan.pos=cur.b[2*ff]+(cur.b[2*ff+1]-cur.b[2*ff])*Math.min(1,k);draw();raf=requestAnimationFrame(loop)}
/* ---- rysowanie ---- */
function rect(b){return[p.sx(b[0]),p.sy(b[3]),p.sx(b[1])-p.sx(b[0]),p.sy(b[2])-p.sy(b[3])]}
function cand(f,t,b,style,w,dash){const c=p.ctx;c.save();c.beginPath();c.strokeStyle=style;c.lineWidth=w;c.setLineDash(dash||[]);
 if(f===0){c.moveTo(p.sx(t),p.sy(b[2]));c.lineTo(p.sx(t),p.sy(b[3]))}else{c.moveTo(p.sx(b[0]),p.sy(t));c.lineTo(p.sx(b[1]),p.sy(t))}c.stroke();c.restore()}
function activeLine(){if(mode==='scan')return{f:scan.f,t:scan.pos};if(hover)return hover;return null}
function drawScatter(){p.clear();const c=p.ctx;
 leaves.forEach(l=>{const r=rect(l.b),col=S.hexToRgb(C[l.pred]),pu=1-l.g/(2/3);c.fillStyle='rgba('+col.join(',')+','+(0.2+0.35*pu)+')';c.fillRect(r[0],r[1],r[2],r[3])});
 if(cur){c.fillStyle='rgba(255,255,255,.55)';leaves.forEach(l=>{if(l!==cur){const r=rect(l.b);c.fillRect(r[0],r[1],r[2],r[3])}})}
 splits.forEach(s=>cand(s.f,s.thr,s.b,'#1f2a4d',2.6));
 p.points(X,Y,'train',Math.max(5,p.w/140));
 if(cur&&mode==='found'&&best)cand(best.f,best.thr,cur.b,'#1f2a4d',3.2,[10,7]);
 const a=activeLine();if(cur&&a)cand(a.f,a.t,cur.b,'#7b5cf0',4)}
function setup(cv){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return{x,w:r.width,h:r.height}}
function visible(f){if(!cur||!res)return[];const pts=res[f];
 if(mode==='found'||mode==='done')return pts;if(mode==='scan'){if(f<scan.f)return pts;if(f>scan.f)return[];
  const v=pts.filter(q=>q[0]<=scan.pos);if(v.length)v.push([scan.pos,v[v.length-1][1]]);return v}return[]}
/* f=0: pasek pod wykresem (X wspólne z wykresem); f=1: pasek z prawej (Y wspólne) */
function drawStrip(f){const cv=$(f===0?'gb':'gr'),G=setup(cv),x=G.x;if(!cur)return;
 const gmax=cur.g*1.1,B=f===0?{t:34,b:26}:{l:12,r:46};
 const sc=v=>f===0?G.h-B.b-v/gmax*(G.h-B.t-B.b):B.l+v/gmax*(G.w-B.l-B.r);
 const pos=f===0?(v=>p.sx(v)):(v=>p.sy(v));
 const P=q=>f===0?[pos(q[0]),sc(q[1])]:[sc(q[1]),pos(q[0])];
 const b0=cur.b[2*f],b1=cur.b[2*f+1],lim=f===0?ds.xlim:ds.ylim;
 x.font='500 13px Inter,system-ui,sans-serif';x.fillStyle='#7b87a8';x.strokeStyle='#e1e6f4';x.lineWidth=1;
 for(let i=0;i<=5;i++){const v=lim[0]+(lim[1]-lim[0])*i/5,q=pos(v);
  x.beginPath();if(f===0){x.moveTo(q,B.t-6);x.lineTo(q,G.h-B.b);x.stroke();x.textAlign='center';x.fillText(v.toFixed(1),Math.min(G.w-14,Math.max(14,q)),G.h-8)}
  else{x.moveTo(B.l,q);x.lineTo(G.w-B.r,q);x.stroke();x.textAlign='right';x.fillText(v.toFixed(1),G.w-8,Math.min(G.h-8,Math.max(16,q+4)))}}
 x.fillStyle='rgba(120,135,175,.16)';
 if(f===0){x.fillRect(0,0,pos(b0),G.h);x.fillRect(pos(b1),0,G.w-pos(b1),G.h)}else{x.fillRect(0,0,G.w,pos(b1));x.fillRect(0,pos(b0),G.w,G.h-pos(b0))}
 x.strokeStyle='#b9c3de';x.lineWidth=1.5;x.setLineDash([7,5]);x.beginPath();
 if(f===0){x.moveTo(pos(b0),sc(cur.g));x.lineTo(pos(b1),sc(cur.g))}else{x.moveTo(sc(cur.g),pos(b0));x.lineTo(sc(cur.g),pos(b1))}x.stroke();x.setLineDash([]);
 x.fillStyle='#5d6a8e';x.font='700 14px Inter,system-ui,sans-serif';x.textAlign='left';
 x.fillText(f===0?'Podział wg: '+NAMES[0]:NAMES[1],f===0?12:12,f===0?20:20);
 if(f===0){x.font='500 13px Inter,system-ui,sans-serif';x.fillStyle='#9aa4c0';x.textAlign='right';x.fillText('gini przed: '+cur.g.toFixed(2),G.w-12,20)}
 const pts=visible(f);
 if(pts.length>1){const A=pts.map(P),first=A[0],last=A[A.length-1];
  const base=q=>f===0?[q[0],sc(0)]:[sc(0),q[1]],par=q=>f===0?[q[0],sc(cur.g)]:[sc(cur.g),q[1]];
  x.beginPath();x.moveTo(base(first)[0],base(first)[1]);A.forEach(q=>x.lineTo(q[0],q[1]));x.lineTo(base(last)[0],base(last)[1]);x.closePath();
  const gr=f===0?x.createLinearGradient(0,sc(cur.g),0,sc(0)):x.createLinearGradient(sc(0),0,sc(cur.g),0);
  gr.addColorStop(0,f===0?'rgba(43,111,214,.10)':'rgba(43,111,214,.02)');gr.addColorStop(1,f===0?'rgba(43,111,214,.02)':'rgba(43,111,214,.10)');x.fillStyle=gr;x.fill();
  x.beginPath();x.moveTo(par(first)[0],par(first)[1]);A.forEach(q=>x.lineTo(q[0],q[1]));x.lineTo(par(last)[0],par(last)[1]);x.closePath();x.fillStyle='rgba(86,135,224,.50)';x.fill();
  x.beginPath();A.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.strokeStyle='#1f3b8a';x.lineWidth=3;x.lineJoin='round';x.stroke()}
 if(mode==='found'||mode==='done'){const win=best&&best.f===f;
  if(res&&res[f].length){let m=res[f][0];res[f].forEach(q=>{if(q[1]<m[1])m=q});const a=P(m);
   x.beginPath();x.arc(a[0],a[1],win?9:5,0,6.2832);x.fillStyle=win?'#1f3b8a':'#9aa4c0';x.fill();x.lineWidth=2.5;x.strokeStyle='#fff';x.stroke()}}
 const a=activeLine();if(a&&a.f===f){x.strokeStyle='#7b5cf0';x.lineWidth=3;x.beginPath();
  if(f===0){x.moveTo(pos(a.t),0);x.lineTo(pos(a.t),G.h-B.b)}else{x.moveTo(0,pos(a.t));x.lineTo(G.w-B.r,pos(a.t))}x.stroke();
  if(pts.length){const q=mode==='scan'?pts[pts.length-1]:[a.t,a.s],pp=P(q);x.beginPath();x.arc(pp[0],pp[1],7,0,6.2832);x.fillStyle='#7b5cf0';x.fill();x.lineWidth=2.5;x.strokeStyle='#fff';x.stroke()}}}
function cnt(c){return c.map((v,i)=>'<i style="color:'+C[i]+'">'+v+'</i>').join('')}
function head(){const h=$('head'),go=$('go');
 if(mode==='done'){h.innerHTML='Drzewo gotowe<small>'+leaves.length+' liści · '+splits.length+' podziałów</small>';go.disabled=true;go.textContent='Szukaj podziału';return}
 let s='Węzeł: '+cur.n+' próbek<br>gini <b>'+cur.g.toFixed(2)+'</b>';
 const a=mode==='scan'?{f:scan.f,t:scan.pos}:(mode==='found'?(hover||{f:best.f,t:best.thr}):null);
 if(mode==='found'&&!hover)s+=' → <b>'+best.score.toFixed(2)+'</b><small>'+NAMES[best.f]+' ≤ '+best.thr.toFixed(2)+'</small>';
 else if(a)s+='<small>'+NAMES[a.f]+' ≤ '+a.t.toFixed(2)+'</small>';
 if(a){const c=counts(a.f,a.t);s+='<div class="cnt">'+cnt(c.l)+'<br>'+cnt(c.r)+'</div>'}
 h.innerHTML=s;go.disabled=mode==='scan';go.textContent=mode==='idle'?'Szukaj podziału':mode==='scan'?'Szukam…':'Podziel tutaj'}
function draw(){drawScatter();drawStrip(0);drawStrip(1);head()}
/* hover po paskach (tylko gdy skan zakończony) */
function hv(f,e){if(mode!=='found')return;const cv=$(f===0?'gb':'gr'),r=cv.getBoundingClientRect();
 const t=f===0?p.ix(e.clientX-r.left):p.iy(e.clientY-r.top);if(t<cur.b[2*f]||t>cur.b[2*f+1]){hover=null;draw();return}
 let q=res[f][0];res[f].forEach(a=>{if(Math.abs(a[0]-t)<Math.abs(q[0]-t))q=a});hover={f,t:q[0],s:q[1]};draw()}
[0,1].forEach(f=>{const cv=$(f===0?'gb':'gr');cv.addEventListener('pointermove',e=>hv(f,e));cv.addEventListener('pointerleave',()=>{hover=null;draw()})});
function act(){if(mode==='idle')startScan();else if(mode==='found'){apply();draw()}}
$('go').addEventListener('click',act);$('rst').addEventListener('click',()=>{init();draw()});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();act()}});
S.onResize(()=>{p.resize();draw()});init();draw();
</script></body></html>
